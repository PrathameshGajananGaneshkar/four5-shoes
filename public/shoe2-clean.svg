<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <defs>
    <linearGradient id="cleanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="50%" stop-color="#181820"/>
      <stop offset="100%" stop-color="#0F0F12"/>
    </linearGradient>

    <radialGradient id="radialSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5722" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#181820" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldMetallic2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE08A"/>
      <stop offset="35%" stop-color="#DF9B28"/>
      <stop offset="70%" stop-color="#F5C451"/>
      <stop offset="100%" stop-color="#B87B14"/>
    </linearGradient>

    <linearGradient id="orangeKinetic2" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="50%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FFAE00"/>
    </linearGradient>

    <linearGradient id="whiteSoleGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#EBECEF"/>
      <stop offset="100%" stop-color="#D0D3D9"/>
    </linearGradient>

    <filter id="cleanShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Clean Studio Background -->
  <rect width="900" height="650" fill="url(#cleanBg)"/>
  <circle cx="450" cy="360" r="320" fill="url(#radialSpot)"/>

  <!-- Official Brand Badge Top Left -->
  <g transform="translate(45, 45)">
    <rect width="110" height="34" rx="8" fill="#1E1E26" stroke="#333342" stroke-width="1.2"/>
    <text x="55" y="23" font-family="'Arial Black', sans-serif" font-size="13" font-weight="900" fill="url(#goldMetallic2)" letter-spacing="2" text-anchor="middle">
      FOUR5.45
    </text>
  </g>

  <!-- Ground Contact Shadow -->
  <ellipse cx="460" cy="535" rx="340" ry="38" fill="#000000" opacity="0.75" filter="url(#cleanShadow)"/>

  <!-- Centered 45 Sneaker Group -->
  <g id="shoeOnly" transform="translate(15, 45)" filter="url(#cleanShadow)">
    <!-- OUTSOLE -->
    <path d="M 180,520 
             C 195,535 240,570 340,578
             C 470,588 640,550 750,470
             C 770,455 780,442 770,432
             C 760,425 745,435 730,448
             C 630,520 460,558 340,548
             C 250,540 205,510 185,498 
             Z" 
          fill="#111114" stroke="#000000" stroke-width="2"/>

    <!-- WHITE KINETIC FOAM MIDSOLE -->
    <path d="M 185,498 
             C 210,530 290,568 400,568 
             C 520,568 660,520 760,445 
             C 775,433 780,418 765,405 
             C 745,410 710,432 630,460 
             C 540,490 410,510 300,495 
             C 230,485 195,465 185,498 
             Z" 
          fill="url(#whiteSoleGrad2)" stroke="#BFC2C9" stroke-width="1.5"/>

    <!-- Midsole Sculpt Grooves -->
    <path d="M 280,515 Q 360,540 450,545 Q 560,545 680,480" fill="none" stroke="#D1D5DB" stroke-width="3" stroke-linecap="round"/>
    <path d="M 330,535 Q 420,552 520,548 Q 620,530 710,470" fill="none" stroke="#E5E7EB" stroke-width="2"/>

    <!-- ORANGE / GOLD KINETIC ACCENT -->
    <path d="M 520,495 
             C 590,475 670,440 740,395 
             C 755,398 765,408 750,420 
             C 675,465 595,500 520,512 
             Z" 
          fill="url(#orangeKinetic2)"/>

    <!-- SHOE MAIN UPPER (Obsidian Black Breathable Mesh) -->
    <path d="M 185,498 
             C 170,480 185,435 240,410
             C 290,385 345,355 420,310
             C 460,285 490,265 520,260
             C 540,257 560,270 565,290
             C 580,310 610,325 650,315
             C 680,275 700,265 725,270
             C 740,275 750,300 740,340
             C 735,360 745,385 755,405
             C 730,440 600,485 450,510
             C 340,528 230,515 185,498
             Z" 
          fill="#151519" stroke="#222228" stroke-width="2"/>

    <!-- Mesh Texture Overlay -->
    <path d="M 210,470 Q 320,440 420,330" fill="none" stroke="#262630" stroke-width="6" opacity="0.6"/>
    <path d="M 230,485 Q 350,455 450,340" fill="none" stroke="#262630" stroke-width="6" opacity="0.6"/>
    <path d="M 270,495 Q 380,465 480,350" fill="none" stroke="#262630" stroke-width="6" opacity="0.6"/>

    <!-- Toe Cap -->
    <path d="M 185,498 C 175,475 190,445 235,430 C 265,475 220,510 185,498 Z" fill="#1C1C22"/>

    <!-- Collar & Heel Counter -->
    <path d="M 645,315 C 675,270 705,260 730,275 C 742,305 735,350 745,405 C 720,405 680,390 645,315 Z" fill="#18181D" stroke="#2B2B36" stroke-width="1.5"/>

    <!-- Gold Heel Pull Tab Ribbon -->
    <path d="M 695,255 C 695,230 730,230 735,265 L 720,275 C 715,255 705,250 700,265 Z" fill="#FFB800" stroke="#E5A700" stroke-width="1.5"/>

    <!-- Heel "45" Mini Badge -->
    <g transform="translate(710, 315) rotate(15)">
      <text font-family="'Impact', sans-serif" font-size="22" font-weight="900" fill="url(#goldMetallic2)" text-anchor="middle">45</text>
    </g>

    <!-- Aerodynamic Orange / Gold Wing Stripes -->
    <path d="M 430,390 L 640,325 L 635,340 L 440,405 Z" fill="url(#orangeKinetic2)"/>
    <path d="M 480,410 L 670,350 L 665,365 L 490,422 Z" fill="url(#orangeKinetic2)"/>

    <!-- PROMINENT WHITE "45" BRAND EMBLEM -->
    <g transform="translate(470, 435) rotate(-16)">
      <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-style="italic" font-size="108" font-weight="900" fill="#000000" opacity="0.6">
        45
      </text>
      <text x="-2" y="-2" font-family="'Impact', 'Arial Black', sans-serif" font-style="italic" font-size="108" font-weight="900" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" letter-spacing="-2">
        45
      </text>
      <text x="0" y="24" font-family="'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#FCE08A" letter-spacing="3">
        FOUR5.45
      </text>
    </g>

    <!-- Tongue & Laces -->
    <path d="M 440,310 C 470,270 495,250 520,250 C 530,265 525,290 515,310 Z" fill="#1C1C22" stroke="#33333E" stroke-width="1.5"/>
    <text x="495" y="280" font-family="'Impact', sans-serif" font-style="italic" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">45</text>

    <!-- Lacing -->
    <path d="M 360,380 L 400,350" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
    <path d="M 360,380 L 400,350" stroke="#2B2B35" stroke-width="4.5" stroke-linecap="round"/>

    <path d="M 390,360 L 435,330" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
    <path d="M 390,360 L 435,330" stroke="#2B2B35" stroke-width="4.5" stroke-linecap="round"/>

    <path d="M 425,340 L 470,310" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
    <path d="M 425,340 L 470,310" stroke="#2B2B35" stroke-width="4.5" stroke-linecap="round"/>

    <path d="M 460,320 L 505,290" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
    <path d="M 460,320 L 505,290" stroke="#2B2B35" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Tagline Bottom Center -->
  <text x="450" y="615" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#71717A" letter-spacing="3" text-anchor="middle">
    CHIKHLI INNOVATION LAB • 45 VELOCITY RUNNER
  </text>
</svg>
