<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1250" width="1080" height="1250">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08080a"/>
      <stop offset="45%" stop-color="#111115"/>
      <stop offset="75%" stop-color="#16161c"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>

    <!-- Gold Lighting Streak -->
    <linearGradient id="goldLightBeam" x1="100%" y1="0%" x2="20%" y2="80%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#F5A623" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#D4AF37" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE08A"/>
      <stop offset="35%" stop-color="#DF9B28"/>
      <stop offset="70%" stop-color="#F5C451"/>
      <stop offset="100%" stop-color="#B87B14"/>
    </linearGradient>

    <!-- Orange Kinetic Accent Gradient -->
    <linearGradient id="orangeKinetic" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="50%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FFAE00"/>
    </linearGradient>

    <!-- Sole Gradient -->
    <linearGradient id="whiteSoleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#EBECEF"/>
      <stop offset="100%" stop-color="#D0D3D9"/>
    </linearGradient>

    <!-- Box Front Gradient -->
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C1C22"/>
      <stop offset="50%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#0B0B0E"/>
    </linearGradient>

    <!-- Box Top Gradient -->
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282830"/>
      <stop offset="100%" stop-color="#1B1B20"/>
    </linearGradient>

    <!-- Box Side Gradient -->
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>

    <!-- Cricket Ball 3D Lighting -->
    <radialGradient id="ballShade" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#E2E4E8"/>
      <stop offset="85%" stop-color="#A6ABB5"/>
      <stop offset="100%" stop-color="#555963"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadowBig" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1080" height="1250" fill="url(#bgGrad)"/>

  <!-- Gold Ambience Beam -->
  <polygon points="1080,0 700,0 350,900 1080,900" fill="url(#goldLightBeam)"/>

  <!-- Polished Marble Floor with Reflection -->
  <rect x="0" y="800" width="1080" height="450" fill="#0C0C0F"/>
  <line x1="0" y1="800" x2="1080" y2="800" stroke="#222228" stroke-width="1.5"/>

  <!-- ================= TOP POSTER HEADER ================= -->
  <g id="headerText" text-anchor="middle">
    <!-- Subhead -->
    <text x="540" y="75" font-family="'Inter', -apple-system, Roboto, sans-serif" font-size="21" font-weight="700" fill="#E5B358" letter-spacing="4">
      GET EXCLUSIVE ACCESS
    </text>

    <!-- Main Title: FOUR5.45 DROPS -->
    <g transform="translate(540, 160)">
      <text font-family="'Arial Black', 'Impact', sans-serif" font-size="78" font-weight="900" letter-spacing="3" text-anchor="middle">
        <tspan fill="#FFFFFF">FOUR</tspan>
        <tspan fill="url(#goldMetallic)">5.45</tspan>
        <tspan fill="#FFFFFF"> DROPS</tspan>
      </text>
    </g>

    <!-- Date Strip with Gold Accents -->
    <g transform="translate(540, 215)">
      <line x1="-220" y1="0" x2="-140" y2="0" stroke="url(#goldMetallic)" stroke-width="2"/>
      <text x="0" y="7" font-family="'Inter', -apple-system, sans-serif" font-size="28" font-weight="800" fill="url(#goldMetallic)" letter-spacing="5">
        ON 18.08.2026
      </text>
      <line x1="140" y1="0" x2="220" y2="0" stroke="url(#goldMetallic)" stroke-width="2"/>
    </g>
  </g>

  <!-- ================= LEFT SLOGAN ================= -->
  <g id="slogan" transform="translate(145, 330) rotate(-7)">
    <text font-family="'Impact', 'Arial Black', sans-serif" font-style="italic" font-size="52" fill="url(#goldMetallic)" letter-spacing="1">
      <tspan x="0" y="0">LIVE IT.</tspan>
      <tspan x="0" y="62">WEAR IT.</tspan>
      <tspan x="0" y="124">BE FOUR5.</tspan>
    </text>
  </g>

  <!-- ================= 3D SHOE BOX ================= -->
  <g id="shoeBox" filter="url(#shadowBig)">
    <!-- Floor Shadow below box -->
    <ellipse cx="510" cy="855" rx="420" ry="45" fill="#000000" opacity="0.8"/>

    <!-- Box Top Face (angled) -->
    <polygon points="120,610 830,470 940,555 240,715" fill="url(#boxTop)" stroke="#4A3D1E" stroke-width="1.5"/>

    <!-- Box Gold Trim on Lid -->
    <polygon points="120,610 830,470 834,475 125,615" fill="url(#goldMetallic)"/>
    <polygon points="830,470 940,555 935,560 825,475" fill="url(#goldMetallic)"/>

    <!-- Box Front Face -->
    <polygon points="120,610 240,715 240,845 120,735" fill="#15151A" stroke="#222228" stroke-width="1"/>
    <polygon points="240,715 845,580 845,710 240,845" fill="url(#boxFront)" stroke="#222228" stroke-width="1"/>

    <!-- Box Right Face -->
    <polygon points="845,580 940,555 940,680 845,710" fill="url(#boxSide)" stroke="#1A1A20" stroke-width="1"/>

    <!-- Side Text "FOUR5.45" -->
    <text x="895" y="640" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#E5B358" letter-spacing="1.5" transform="rotate(-15 895 640)">
      FOUR5.45
    </text>

    <!-- Front Big Gold "45" Logo & Underline & FOUR5.45 text on Front Box Face -->
    <g transform="translate(370, 770) skewY(-12.5)">
      <!-- Big 45 -->
      <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-style="italic" font-size="110" font-weight="900" fill="url(#goldMetallic)" letter-spacing="-3">
        45
      </text>
      <!-- Underline -->
      <line x1="-15" y1="12" x2="160" y2="12" stroke="url(#goldMetallic)" stroke-width="4.5"/>
      <!-- Text FOUR5.45 -->
      <text x="0" y="42" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" fill="url(#goldMetallic)" letter-spacing="3">
        FOUR5.45
      </text>
    </g>
  </g>

  <!-- ================= 45 VELOCITY RUNNER SNEAKER ================= -->
  <g id="shoe" transform="translate(35, 10)" filter="url(#shadowBig)">
    <!-- Shoe Contact Shadow onto Box -->
    <ellipse cx="500" cy="580" rx="270" ry="32" fill="#000000" opacity="0.65"/>

    <!-- OUTSOLE (Black Rubber with Grip) -->
    <path d="M 180,520 
             C 195,535 240,570 340,578
             C 470,588 640,550 750,470
             C 770,455 780,442 770,432
             C 760,425 745,435 730,448
             C 630,520 460,558 340,548
             C 250,540 205,510 185,498 
             Z" 
          fill="#111114" stroke="#000000" stroke-width="2"/>

    <!-- WHITE KINETIC FOAM MIDSOLE -->
    <path d="M 185,498 
             C 210,530 290,568 400,568 
             C 520,568 660,520 760,445 
             C 775,433 780,418 765,405 
             C 745,410 710,432 630,460 
             C 540,490 410,510 300,495 
             C 230,485 195,465 185,498 
             Z" 
          fill="url(#whiteSoleGrad)" stroke="#BFC2C9" stroke-width="1.5"/>

    <!-- Midsole Sculpt Lines (Kinetic Grooves) -->
    <path d="M 280,515 Q 360,540 450,545 Q 560,545 680,480" fill="none" stroke="#D1D5DB" stroke-width="3" stroke-linecap="round"/>
    <path d="M 330,535 Q 420,552 520,548 Q 620,530 710,470" fill="none" stroke="#E5E7EB" stroke-width="2"/>

    <!-- ORANGE / GOLD ENERGETIC MIDSOLE ACCENT -->
    <path d="M 520,495 
             C 590,475 670,440 740,395 
             C 755,398 765,408 750,420 
             C 675,465 595,500 520,512 
             Z" 
          fill="url(#orangeKinetic)"/>

    <!-- SHOE MAIN UPPER BODY (Obsidian Black Breathable Mesh) -->
    <path d="M 185,498 
             C 170,480 185,435 240,410
             C 290,385 345,355 420,310
             C 460,285 490,265 520,260
             C 540,257 560,270 565,290
             C 580,310 610,325 650,315
             C 680,275 700,265 725,270
             C 740,275 750,300 740,340
             C 735,360 745,385 755,405
             C 730,440 600,485 450,510
             C 340,528 230,515 185,498
             Z" 
          fill="#151519" stroke="#222228" stroke-width="2"/>

    <!-- Mesh Texture Overlay (Subtle Tech Grid) -->
    <path d="M 210,470 Q 320,440 420,330" fill="none" stroke="#262630" stroke-width="6" opacity="0.6"/>
    <path d="M 230,485 Q 350,455 450,340" fill="none" stroke="#262630" stroke-width="6" opacity="0.6"/>
    <path d="M 270,495 Q 380,465 480,350" fill="none" stroke="#262630" stroke-width="6" opacity="0.6"/>

    <!-- Toe Cap Reinforcement -->
    <path d="M 185,498 C 175,475 190,445 235,430 C 265,475 220,510 185,498 Z" fill="#1C1C22"/>

    <!-- Collar & Heel Counter (Reinforced) -->
    <path d="M 645,315 C 675,270 705,260 730,275 C 742,305 735,350 745,405 C 720,405 680,390 645,315 Z" fill="#18181D" stroke="#2B2B36" stroke-width="1.5"/>

    <!-- Yellow / Gold Heel Pull Tab Ribbon -->
    <path d="M 695,255 C 695,230 730,230 735,265 L 720,275 C 715,255 705,250 700,265 Z" fill="#FFB800" stroke="#E5A700" stroke-width="1.5"/>

    <!-- Heel "45" Mini Badge -->
    <g transform="translate(710, 315) rotate(15)">
      <text font-family="'Impact', sans-serif" font-size="22" font-weight="900" fill="url(#goldMetallic)" text-anchor="middle">45</text>
    </g>

    <!-- Aerodynamic Orange / Gold Wing Stripes on Lateral Side -->
    <path d="M 430,390 L 640,325 L 635,340 L 440,405 Z" fill="url(#orangeKinetic)"/>
    <path d="M 480,410 L 670,350 L 665,365 L 490,422 Z" fill="url(#orangeKinetic)"/>

    <!-- PROMINENT WHITE "45" BRAND EMBLEM (The Hero Logo) -->
    <g transform="translate(470, 435) rotate(-16)">
      <!-- Glow behind logo -->
      <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-style="italic" font-size="108" font-weight="900" fill="#000000" opacity="0.6" filter="url(#shadowBig)">
        45
      </text>
      <!-- White Crisp 45 Logo -->
      <text x="-2" y="-2" font-family="'Impact', 'Arial Black', sans-serif" font-style="italic" font-size="108" font-weight="900" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" letter-spacing="-2">
        45
      </text>
      <text x="0" y="24" font-family="'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#FCE08A" letter-spacing="3">
        FOUR5.45
      </text>
    </g>

    <!-- Tongue & Laces -->
    <!-- Tongue -->
    <path d="M 440,310 C 470,270 495,250 520,250 C 530,265 525,290 515,310 Z" fill="#1C1C22" stroke="#33333E" stroke-width="1.5"/>
    <!-- Tongue 45 Logo -->
    <text x="495" y="280" font-family="'Impact', sans-serif" font-style="italic" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">45</text>

    <!-- Athletic Cross Lacing -->
    <path d="M 360,380 L 400,350" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
    <path d="M 360,380 L 400,350" stroke="#2B2B35" stroke-width="4.5" stroke-linecap="round"/>

    <path d="M 390,360 L 435,330" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
    <path d="M 390,360 L 435,330" stroke="#2B2B35" stroke-width="4.5" stroke-linecap="round"/>

    <path d="M 425,340 L 470,310" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
    <path d="M 425,340 L 470,310" stroke="#2B2B35" stroke-width="4.5" stroke-linecap="round"/>

    <path d="M 460,320 L 505,290" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
    <path d="M 460,320 L 505,290" stroke="#2B2B35" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- ================= CRICKET BALL WITH 45 LOGO ================= -->
  <g id="cricketBall" transform="translate(805, 830)" filter="url(#shadowBig)">
    <!-- Floor Shadow -->
    <ellipse cx="65" cy="115" rx="60" ry="18" fill="#000000" opacity="0.75"/>

    <!-- Ball Body with 3D Sphere Shading -->
    <circle cx="65" cy="65" r="62" fill="url(#ballShade)"/>

    <!-- Cricket Ball Raised Seam Stitching (Arc across ball) -->
    <path d="M 12,40 C 45,65 85,75 118,90" fill="none" stroke="#C5CAD4" stroke-width="4"/>
    <path d="M 12,40 C 45,65 85,75 118,90" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3,3"/>

    <!-- Official "45 FOUR5.45" Stamp on Cricket Ball -->
    <g transform="translate(68, 60) rotate(-10)">
      <rect x="-32" y="-24" width="64" height="42" rx="6" fill="#FFFFFF" stroke="#0F0F12" stroke-width="1.8"/>
      <text x="0" y="-1" font-family="'Impact', 'Arial Black', sans-serif" font-style="italic" font-size="28" font-weight="900" fill="#0A0A0D" text-anchor="middle">
        45
      </text>
      <text x="0" y="12" font-family="'Arial Black', sans-serif" font-size="7.5" font-weight="900" fill="#0A0A0D" letter-spacing="1" text-anchor="middle">
        FOUR5.45
      </text>
    </g>
  </g>

  <!-- ================= BOTTOM FEATURE TILES (4 CARDS) ================= -->
  <g id="featureCards" transform="translate(60, 1080)">
    <!-- CARD 1: PERFORMANCE -->
    <g transform="translate(0, 0)">
      <rect width="215" height="110" rx="14" fill="#141419" stroke="#252530" stroke-width="1.2"/>
      <!-- Lightning Icon -->
      <polygon points="32,25 24,45 34,45 28,65 42,40 32,40" fill="url(#goldMetallic)"/>
      <text x="54" y="44" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" letter-spacing="1">
        PERFORMANCE
      </text>
      <text x="20" y="75" font-family="'Inter', sans-serif" font-size="12" fill="#9CA3AF" width="180">
        Engineered for the
      </text>
      <text x="20" y="93" font-family="'Inter', sans-serif" font-size="12" fill="#9CA3AF">
        best performance.
      </text>
    </g>

    <!-- CARD 2: LIGHTWEIGHT -->
    <g transform="translate(250, 0)">
      <rect width="215" height="110" rx="14" fill="#141419" stroke="#252530" stroke-width="1.2"/>
      <!-- Feather Icon -->
      <path d="M 40,25 C 25,35 25,55 35,62 C 40,55 42,45 40,25 Z M 35,45 L 45,55" fill="none" stroke="url(#goldMetallic)" stroke-width="2.5" stroke-linecap="round"/>
      <text x="54" y="44" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" letter-spacing="1">
        LIGHTWEIGHT
      </text>
      <text x="20" y="75" font-family="'Inter', sans-serif" font-size="12" fill="#9CA3AF">
        Move fast.
      </text>
      <text x="20" y="93" font-family="'Inter', sans-serif" font-size="12" fill="#9CA3AF">
        Stay effortless.
      </text>
    </g>

    <!-- CARD 3: DURABILITY -->
    <g transform="translate(500, 0)">
      <rect width="215" height="110" rx="14" fill="#141419" stroke="#252530" stroke-width="1.2"/>
      <!-- Shield Check Icon -->
      <path d="M 33,26 L 43,30 L 43,45 C 43,55 33,62 33,62 C 33,62 23,55 23,45 L 23,30 Z" fill="none" stroke="url(#goldMetallic)" stroke-width="2.5"/>
      <path d="M 28,42 L 32,46 L 39,38" fill="none" stroke="url(#goldMetallic)" stroke-width="2.5" stroke-linecap="round"/>
      <text x="54" y="44" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" letter-spacing="1">
        DURABILITY
      </text>
      <text x="20" y="75" font-family="'Inter', sans-serif" font-size="12" fill="#9CA3AF">
        Built tough.
      </text>
      <text x="20" y="93" font-family="'Inter', sans-serif" font-size="12" fill="#9CA3AF">
        Made to last.
      </text>
    </g>

    <!-- CARD 4: COMFORT -->
    <g transform="translate(750, 0)">
      <rect width="215" height="110" rx="14" fill="#141419" stroke="#252530" stroke-width="1.2"/>
      <!-- Shoe Sole Insole Icon -->
      <path d="M 23,48 C 23,36 30,30 35,30 C 40,30 43,36 43,45 C 43,55 38,58 38,62 L 28,62 C 25,58 23,55 23,48 Z" fill="none" stroke="url(#goldMetallic)" stroke-width="2.5"/>
      <text x="54" y="44" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" letter-spacing="1">
        COMFORT
      </text>
      <text x="20" y="75" font-family="'Inter', sans-serif" font-size="12" fill="#9CA3AF">
        Cushioned for
      </text>
      <text x="20" y="93" font-family="'Inter', sans-serif" font-size="12" fill="#9CA3AF">
        all-day comfort.
      </text>
    </g>
  </g>
</svg>
